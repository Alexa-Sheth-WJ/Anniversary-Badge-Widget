<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ultium Cells · Anniversary</title>
<style>
:root{
  --brand:#0B2A8F;           /* primary  (banner royal blue) */
  --brand-2:#1E6FD9;         /* secondary (badge bright blue) */
  --brand-ink:#1B1446;       /* logo "cells" navy */
  --page:#070D2B;
  --surface:#0E1745;
  --surface-2:#132057;
  --ink:#EEF2FF;
  --ink-soft:#AEBBE6;
  --line:rgba(158,180,255,.16);
  --dot:rgba(30,111,217,.30);
  --logo-filter:brightness(0) invert(1);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Inter,system-ui,sans-serif;
  color-scheme:dark light;
}
@media (prefers-color-scheme: light){
  :root{
    --page:#EEF2FB;
    --surface:#FFFFFF;
    --surface-2:#F2F6FF;
    --ink:#101A4F;
    --ink-soft:#4B5A8E;
    --line:rgba(11,42,143,.12);
    --dot:rgba(30,111,217,.16);
    --logo-filter:none;
  }
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--page);
  font-family:var(--font);
  color:var(--ink);
  display:grid;place-items:center;
  padding:8px;
  -webkit-font-smoothing:antialiased;
  overflow:hidden;
}

/* ---------- frame: sized by aspect ratio AND the space the host gives us ---------- */
.frame{
  --ar:1.3333;
  width:min(100%, 520px, calc((100vh - 16px) * var(--ar)));
  aspect-ratio:4 / 3;
  position:relative;
  border-radius:clamp(12px,4cqmin,22px);
  background:var(--surface);
  border:1px solid var(--line);
  overflow:hidden;
  container-type:size;
  container-name:frame;
  isolation:isolate;
}
/* halftone corner, echoes the banner art */
.frame::before{
  content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;
  background-image:radial-gradient(circle, var(--dot) 1.1px, transparent 1.6px);
  background-size:9px 9px;
  -webkit-mask-image:radial-gradient(120% 90% at 100% 100%, #000 0%, transparent 60%);
          mask-image:radial-gradient(120% 90% at 100% 100%, #000 0%, transparent 60%);
}

.inner{
  position:absolute;inset:0;
  display:grid;
  grid-template-rows:auto 1fr;
  padding:5cqmin 6cqmin;
  gap:2cqmin;
}
.top{display:flex;align-items:center;justify-content:space-between;gap:3cqmin;min-height:0}
.logo{height:clamp(18px,11cqmin,44px);width:auto;filter:var(--logo-filter);display:block}
.state-chip{
  font-size:clamp(10px,3.6cqmin,14px);font-weight:600;
  color:var(--ink-soft);
  padding:.35em .8em;border-radius:999px;
  background:var(--surface-2);border:1px solid var(--line);
  white-space:nowrap;
}
.state-chip:empty{display:none}

/* body: stacked by default, side-by-side on wide frames */
.body{
  min-height:0;
  display:grid;
  grid-template-columns:1fr;
  grid-template-rows:auto auto;
  align-content:center;justify-items:center;
  text-align:center;
  gap:3cqmin;
}
@container frame (aspect-ratio > 1.15){
  .body{
    grid-template-columns:auto 1fr;
    grid-template-rows:1fr;
    align-items:center;justify-items:start;
    text-align:left;
    gap:5cqmin;
  }
}

/* ---------- badge ---------- */
.badge{
  position:relative;
  width:min(72cqw, 46cqh);
  aspect-ratio:1;
  container-type:inline-size;
}
@container frame (aspect-ratio > 1.15){
  .badge{width:min(41cqw, 72cqh)}
}
.badge img{width:100%;height:100%;display:block;filter:drop-shadow(0 2cqmin 3cqmin rgba(6,20,80,.28))}
.badge .num{
  position:absolute;left:0;right:0;top:21%;height:32.6%;
  overflow:hidden;                 /* digit tucks behind the ribbon */
  display:flex;justify-content:center;align-items:flex-start;
}
.badge .num span{
  font-family:var(--font);
  font-weight:800;
  font-size:47cqw;line-height:.78;
  letter-spacing:-.04em;
  padding-top:5.2cqw;
  background:linear-gradient(180deg,#2C78E0 0%,#1557C4 45%,#0D3E9F 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.badge .num span.two{font-size:37cqw;padding-top:7cqw}
.badge .num[hidden]{display:none}

/* welcome mark (under one year) */
.welcome-mark{
  width:min(62cqw, 40cqh);aspect-ratio:1;border-radius:50%;
  display:grid;place-items:center;
  background:radial-gradient(circle at 50% 40%, var(--surface-2), transparent 70%);
  border:1px dashed var(--line);
}
@container frame (aspect-ratio > 1.15){ .welcome-mark{width:min(40cqw,64cqh)} }
.welcome-mark svg{width:46%;height:auto}

/* ---------- copy ---------- */
.copy{display:grid;gap:1.6cqmin;max-width:34ch;min-width:0}
.title{
  font-size:clamp(16px,min(8.4cqmin,6.2cqw),40px);
  font-weight:800;font-style:italic;
  letter-spacing:-.025em;line-height:1.02;
  text-wrap:balance;
}
.metric{
  font-size:clamp(13px,5.2cqmin,22px);
  font-weight:650;line-height:1.2;
  color:var(--brand-2);
}
.note{
  font-size:clamp(11px,3.9cqmin,16px);
  color:var(--ink-soft);line-height:1.35;
  text-wrap:pretty;
}
.note:empty{display:none}
@media (prefers-color-scheme: dark){ .metric{color:#7FB2FF} }

/* ---------- anniversary-today takeover ---------- */
.frame.is-today{
  background:
    radial-gradient(120% 90% at 50% 10%, #1A3FC0 0%, transparent 60%),
    linear-gradient(160deg,#0B2A8F 0%,#0A2380 55%,#081B66 100%);
  border-color:rgba(255,255,255,.12);
  color:#fff;
}
.frame.is-today::before{
  background-image:radial-gradient(circle, rgba(70,140,255,.32) 1.2px, transparent 1.8px);
}
.frame.is-today .logo{filter:brightness(0) invert(1)}
.frame.is-today .metric{color:#8EC2FF}
.frame.is-today .note{color:#C9D6FF}
.frame.is-today .state-chip{color:#fff;background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.2)}

/* confetti: one orchestrated burst on the day, then it settles */
.confetti{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.confetti i{
  position:absolute;top:-6%;
  width:var(--w);height:var(--h);
  background:var(--c);border-radius:1px;
  opacity:0;
  animation:fall var(--d) linear var(--delay) 3 both;
}
.confetti i.curl{
  background:none;border:2px solid var(--c);border-radius:50%;
  border-right-color:transparent;border-bottom-color:transparent;
}
@keyframes fall{
  0%{transform:translate3d(0,0,0) rotate(0);opacity:0}
  8%{opacity:.95}
  85%{opacity:.85}
  100%{transform:translate3d(var(--dx),118cqh,0) rotate(var(--r));opacity:0}
}
.inner{z-index:1}

/* pulse on the status chip when it's the day */
.pulse{display:inline-block;width:.55em;height:.55em;border-radius:50%;background:#7FD3FF;margin-right:.45em;vertical-align:.05em;
  animation:pulse 1.5s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.7)}}

@media (prefers-reduced-motion: reduce){
  .confetti{display:none}
  .pulse{animation:none}
}

/* tiny frames: trim secondary copy */
@container frame (max-height: 200px){ .note{display:none} }
@container frame (max-width: 260px){ .state-chip{display:none} }
</style>
</head>

/* ---------- 4. Dates (all local calendar days, no timezone drift) ---------- */
function parseDay(s){
  if(!s) return null;
  s = String(s).trim();
  let m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);              // ISO date or timestamp
  if(m) return mk(+m[1], +m[2], +m[3]);
  m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);               // M/D/YYYY
  if(m) return mk(+m[3], +m[1], +m[2]);
  return null;
  function mk(y,mo,d){
    const dt = new Date(y, mo-1, d);
    return (dt.getFullYear()===y && dt.getMonth()===mo-1 && dt.getDate()===d) ? dt : null;
  }
}
function dayNum(d){ return Math.round(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) / 864e5); }
function anniversaryIn(hire, year){
  // Feb 29 hires celebrate on Feb 28 in non-leap years
  const d = new Date(year, hire.getMonth(), hire.getDate());
  return d.getMonth() === hire.getMonth() ? d : new Date(year, hire.getMonth()+1, 0);
}

/* Deterministic fallback: same employeeId always gets the same hire date */
function fnv1a(str){
  let h = 0x811c9dc5;
  for(let i=0;i<str.length;i++){ h ^= str.charCodeAt(i); h = Math.imul(h, 0x01000193); }
  return h >>> 0;
}
function fallbackHire(seed){
  const base = new Date(2019, 7, 1);                  // Aug 1, 2019
  const off = fnv1a(seed) % 2430;                     // spread across ~6.6 years
  return new Date(base.getFullYear(), base.getMonth(), base.getDate() + off);
}

const hire = parseDay(vars.hireDate) || fallbackHire(vars.employeeId || vars.employeeCode || vars.username || 'ultium-cells-demo');
const usingFallback = !parseDay(vars.hireDate);

function today(){ return parseDay(vars.previewDate) || new Date(); }

function computeState(now){
  const t = dayNum(now);
  let years = now.getFullYear() - hire.getFullYear();
  let thisYear = anniversaryIn(hire, now.getFullYear());
  if(dayNum(thisYear) > t) years -= 1;
  if(dayNum(hire) > t) years = -1;                    // not started yet → welcome
  const nextYearNum = Math.max(years, 0) + 1;
  const next = years < 0 ? anniversaryIn(hire, hire.getFullYear()+1)
             : (dayNum(thisYear) >= t ? thisYear : anniversaryIn(hire, now.getFullYear()+1));
  const daysTo = dayNum(next) - t;

  if(years >= 1 && daysTo === 0) return { mode:'today', years, date:next, daysTo };
  if(daysTo >= 1 && daysTo <= 30 && years >= 0) return { mode: daysTo <= 7 ? 'week' : 'month', years:nextYearNum, date:next, daysTo };
  if(years < 1) return { mode:'welcome', years:0, date:next, daysTo };
  return { mode:'regular', years, date:next, daysTo };
}

/* ---------- 5. Rendering ---------- */
const $ = id => document.getElementById(id);
const fmtLong = d => d.toLocaleDateString(vars.language || 'en', { month:'long', day:'numeric', year:'numeric' });
const fmtShort = d => d.toLocaleDateString(vars.language || 'en', { weekday:'long', month:'long', day:'numeric' });
const yearsLabel = n => n + (n === 1 ? ' Year' : ' Years') + ' with Ultium Cells';
const WORDS = ['zero','one','two','three','four','five','six','seven','eight','nine','ten'];
const word = n => WORDS[n] || String(n);

function badge(n){
  const wrap = document.createElement('div');
  wrap.className = 'badge';
  const img = document.createElement('img');
  img.alt = n + (n === 1 ? ' year' : ' years') + ' anniversary badge';
  img.src = BADGES[n] || BADGE_BLANK;
  img.decoding = 'async';
  wrap.appendChild(img);
  if(!BADGES[n]){
    const num = document.createElement('div');
    num.className = 'num';
    const s = document.createElement('span');
    s.textContent = String(n);
    if(String(n).length > 1) s.className = 'two';
    num.appendChild(s); wrap.appendChild(num);
  }
  return wrap;
}
function welcomeMark(){
  const d = document.createElement('div');
  d.className = 'welcome-mark';
  // three stacked cell bars — the Ultium mark, drawn rather than embedded
  d.innerHTML = '<svg viewBox="0 0 60 44" aria-hidden="true"><rect x="0" y="0" width="60" height="12" rx="2" fill="#1E6FD9"/><rect x="0" y="16" width="60" height="12" rx="2" fill="#2BA8E0"/><rect x="0" y="32" width="60" height="12" rx="2" fill="#1E6FD9" opacity=".55"/></svg>';
  return d;
}

let confettiBuilt = false;
function buildConfetti(){
  if(confettiBuilt) return; confettiBuilt = true;
  const host = $('confetti');
  const colors = ['#2BA8E0','#1E6FD9','#7FD3FF','#FFFFFF','#4F7BFF','#9C7BFF'];
  let h = fnv1a('confetti-' + (vars.employeeId || 'x'));
  const rnd = () => (h = Math.imul(h ^ (h >>> 15), 2246822507) >>> 0, (h % 10000) / 10000);
  for(let i=0;i<34;i++){
    const p = document.createElement('i');
    if(i % 5 === 0) p.className = 'curl';
    const w = 4 + rnd()*5;
    p.style.cssText =
      '--c:'+colors[i % colors.length]+';--w:'+w.toFixed(1)+'px;--h:'+(i%5===0? w : w*(1.6+rnd())).toFixed(1)+'px;'+
      'left:'+(rnd()*100).toFixed(1)+'%;--dx:'+((rnd()-.5)*60).toFixed(0)+'px;--r:'+(360+rnd()*540).toFixed(0)+'deg;'+
      '--d:'+(3.2+rnd()*2.6).toFixed(2)+'s;--delay:'+(-rnd()*0.6 + rnd()*1.8).toFixed(2)+'s';
    host.appendChild(p);
  }
}

let lastKey = '';
function render(){
  const now = today();
  const st = computeState(now);
  const key = st.mode + '|' + st.years + '|' + st.daysTo;
  if(key === lastKey) return;
  lastKey = key;

  const visual = $('visual'); visual.replaceChildren();
  frame.classList.toggle('is-today', st.mode === 'today');
  $('confetti').replaceChildren(); confettiBuilt = false;
  const chip = $('chip');
  const who = vars.username ? String(vars.username) : '';

  if(st.mode === 'today'){
    visual.appendChild(badge(st.years));
    $('title').textContent = 'Happy Anniversary!';
    $('metric').textContent = yearsLabel(st.years);
    $('note').textContent = (who ? 'Congratulations, ' + who + '. ' : '') + 'Thank you for ' + word(st.years) + (st.years === 1 ? ' year' : ' years') + ' on the team.';
    chip.innerHTML = '<span class="pulse"></span>Today';
    buildConfetti();
  } else if(st.mode === 'week' || st.mode === 'month'){
    visual.appendChild(badge(st.years));
    $('title').textContent = st.mode === 'week' ? 'Anniversary this week' : 'Anniversary coming up';
    $('metric').textContent = yearsLabel(st.years);
    $('note').textContent = fmtShort(st.date) + (st.daysTo === 1 ? ', tomorrow.' : ', in ' + st.daysTo + ' days.');
    chip.textContent = st.mode === 'week' ? 'This week' : 'This month';
  } else if(st.mode === 'welcome'){
    visual.appendChild(welcomeMark());
    $('title').textContent = 'Welcome to Ultium Cells!';
    $('metric').textContent = 'Glad you’re on the team';
    $('note').textContent = 'Your first anniversary is ' + fmtLong(st.date) + '.';
    chip.textContent = '';
  } else {
    visual.appendChild(badge(st.years));
    $('title').textContent = 'Happy Anniversary!';
    $('metric').textContent = yearsLabel(st.years);
    $('note').textContent = 'Thank you for being part of the team.';
    chip.textContent = '';
  }
  frame.dataset.state = st.mode;
  frame.dataset.fallback = usingFallback ? '1' : '0';
}

render();
/* 1 s tick: keeps the state correct across midnight on always-on tiles */
setInterval(render, 1000);

window.__widget = { vars, hire, computeState };   // debug hook for QA
})();
</script>
